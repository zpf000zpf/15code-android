name: Android Smoke

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/android-smoke.yml"

jobs:
  composer-input:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Smoke test composer input
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.fifteencode.android/.MainActivity --ez smokeComposer true
            sleep 4
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window-before.xml
            python3 - <<'PY'
            import re
            xml = open('/tmp/window-before.xml', encoding='utf-8').read()
            m = re.search(r'content-desc="chat-composer-input"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
            if not m:
              raise SystemExit('composer input not found in UI dump')
            x1, y1, x2, y2 = map(int, m.groups())
            print((x1 + x2) // 2, (y1 + y2) // 2)
            open('/tmp/tap.txt', 'w').write(f'{(x1 + x2) // 2} {(y1 + y2) // 2}')
            PY
            read X Y < /tmp/tap.txt
            adb shell input tap "$X" "$Y"
            sleep 1
            adb shell input text smoke123
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window-after.xml
            grep -q 'smoke123' /tmp/window-after.xml
