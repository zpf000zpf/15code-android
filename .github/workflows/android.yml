name: Build Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Catalog and source regression gate
        shell: bash
        run: |
          bash scripts/check_android_regressions.sh
          export EXPECTED_ANDROID_VERSION="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)"
          test -n "$EXPECTED_ANDROID_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$EXPECTED_ANDROID_VERSION"
          fi
          node - <<'NODE'
          (async () => {
            const response = await fetch('https://15code.com/api/catalog');
            if (!response.ok) throw new Error(`Catalog HTTP ${response.status}`);
            const catalog = await response.json();
            const release = catalog.releases?.android?.stable;
            if (catalog.schemaVersion !== 1 || !release?.minimumSupportedVersion) {
              throw new Error('Catalog release policy is incomplete');
            }
            const asset = await fetch(new URL(release.downloadUrl, 'https://15code.com'), { method: 'HEAD' });
            if (!asset.ok || !/^[a-f0-9]{64}$/.test(release.sha256 || '')) {
              throw new Error('Current Catalog Android release is not downloadable or lacks SHA256');
            }
          })();
          NODE

      - name: Restore release signing key
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_SECRET_BASE64: ${{ secrets.ANDROID_SIGNING_SECRET_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64"
          test -n "$ANDROID_SIGNING_SECRET_BASE64"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/15code-release.jks"
          printf '%s' "$ANDROID_SIGNING_SECRET_BASE64" | base64 --decode > "$RUNNER_TEMP/15code-release.secret"
          chmod 600 "$RUNNER_TEMP/15code-release.jks" "$RUNNER_TEMP/15code-release.secret"

      - name: Build signed release artifacts
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/15code-release.jks
          ANDROID_KEY_ALIAS: 15code-release
        run: |
          export ANDROID_KEYSTORE_PASSWORD="$(openssl dgst -sha256 "$RUNNER_TEMP/15code-release.secret" | awk '{print $2}')"
          export ANDROID_KEY_PASSWORD="$(openssl dgst -sha512 "$RUNNER_TEMP/15code-release.secret" | awk '{print substr($2, 1, 64)}')"
          gradle assembleDebug assembleRelease bundleRelease

      - name: Verify release signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -Fi 'certificate SHA-256 digest: 5ebc67386d8008deafc7888306235ec530b7546f89c3dd1f24c5f35e0d69a2bf'

      - name: Collect artifacts
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/15code-android-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/15code-android-v${VERSION}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/15code-android-v${VERSION}-release.aab"
          sha256sum dist/* > "dist/15code-android-v${VERSION}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: 15code-android
          path: dist/*

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
